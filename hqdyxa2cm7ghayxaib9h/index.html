<title>家計簿</title>
<style>/* ============ 土台（マネーフォワード風 = theme-mf） ============ */
:root {
  --accent: #e8730a; --on-accent: #fff; --ink: #222; --sub: #52514e; --muted: #898781; --line: #dcdcdc; --hair: #e9e9e6;
  --bg: #fff; --surface: #fff; --soft: #f7f7f5; --warn: #b45309; --warn-bg: #fff4e0; --ok: #006300; --ok-bg: #eaf6ea; --tint: #fff3e6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --other: #898781;
  --radius: 3px; --font: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic UI", Meiryo, sans-serif;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 14px 60px; }

header { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; padding: 10px 14px 4px; max-width: 760px; margin: 0 auto; }
.brand .logo { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-weight: 700; display: grid; place-items: center; font-size: 14px; }
.brand b { font-size: 16px; } .brand small { color: var(--muted); font-size: 11px; margin-left: auto; }
nav { display: flex; max-width: 760px; margin: 0 auto; padding: 0 6px; overflow-x: auto; }
nav button { flex: 1; min-width: 52px; background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 4px 7px; font-size: 13px; white-space: nowrap; }
nav button svg { display: none; }
nav button.on { border-bottom-color: var(--accent); font-weight: 700; }

.title { display: none; }
.card { margin: 0; }
h2 { font-size: 15px; margin: 22px 0 10px; padding-bottom: 5px; border-bottom: 2px solid var(--accent); }
h2 small { font-weight: 400; font-size: 11px; color: var(--sub); margin-left: 6px; }
h3 { font-size: 13px; margin: 16px 0 6px; padding-left: 7px; border-left: 4px solid var(--accent); }
.note { color: var(--sub); font-size: 12px; }

.month { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 14px 0 4px; }
.month select { font-size: 19px; font-weight: 700; border: 0; background: none; text-align: center; padding: 2px 4px; }
.month button, .btn { background: var(--surface); border: 1px solid #c8c8c8; border-radius: var(--radius); padding: 5px 12px; }
.month button { font-size: 18px; line-height: 1.1; }
.month button:disabled { opacity: .3; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.btn.danger { color: #b3261e; }
.period { text-align: center; color: var(--sub); font-size: 12px; }

/* いちばん上の大きな数字 */
.hero { border: 1px solid var(--line); border-top: 3px solid var(--accent); padding: 12px 14px; margin: 12px 0; text-align: center; }
.hero .lab { font-size: 12px; font-weight: 700; color: var(--sub); }
.hero .big { font-size: 34px; font-weight: 700; line-height: 1.25; font-variant-numeric: tabular-nums; }
.hero .sub { font-size: 12px; color: var(--sub); }
.chip { display: inline-block; margin-top: 8px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: var(--soft); border: 1px solid var(--line); color: var(--sub); }
.chip.ok { background: var(--ok-bg); border-color: #a9d3a9; color: var(--ok); } .chip.plan { background: var(--warn-bg); border-color: #f1c27d; color: #7a4a00; }

table { width: 100%; border-collapse: collapse; }
th, td { border: 1px solid var(--line); padding: 7px 9px; text-align: right; font-variant-numeric: tabular-nums; }
th { font-weight: 700; } td:first-child, th:first-child { text-align: left; }
tr.sum td { font-weight: 700; background: var(--soft); } tr.grand td { font-weight: 700; background: var(--tint); font-size: 15px; }
.settle th, .settle td { padding: 7px 6px; white-space: nowrap; }
.diff { display: block; font-size: 10px; font-weight: 400; color: var(--muted); }
.sdate { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sdate input { border: 1px solid #c8c8c8; border-radius: var(--radius); padding: 7px 8px; background: var(--surface); font-size: 16px; }

/* 明細 */
.tx { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 10px; width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--hair); padding: 8px 2px; }
div.tx { cursor: default; }
.tx .meta { grid-column: 1 / 3; font-size: 11px; color: var(--sub); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tx .name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tx .amt { font-variant-numeric: tabular-nums; white-space: nowrap; }
.hc i, .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.tag { font-size: 10px; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--sub); white-space: nowrap; }
.tag.warn { border-color: var(--warn); color: var(--warn); background: var(--warn-bg); }
.more { text-align: right; margin: 8px 0; } .more button:not(.btn) { background: none; border: 0; text-decoration: underline; padding: 4px 0; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.filters select, .filters input { border: 1px solid #c8c8c8; border-radius: var(--radius); padding: 6px 8px; background: var(--surface); min-width: 0; font-size: 16px; }
.filters input { flex: 1; }
.alert { background: var(--warn-bg); border: 1px solid #f1c27d; color: #7a4a00; padding: 8px 10px; border-radius: var(--radius); margin: 10px 0; font-size: 13px; }
.alert button { background: none; border: 0; text-decoration: underline; padding: 0; color: inherit; }
.meter { grid-column: 1 / 3; height: 8px; background: var(--hair); border-radius: 4px; overflow: hidden; margin: 5px 0 3px; }
.meter i { display: block; height: 100%; background: var(--s1); border-radius: 4px; } .meter.over i { background: #d03b3b; }

/* カレンダー */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); border-left: 1px solid var(--line); border-top: 1px solid var(--line); }
.cal > * { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-width: 0; }
.cal .wd { text-align: center; font-weight: 700; font-size: 12px; padding: 2px 0; }
.cal button { background: var(--surface); border-top: 0; border-left: 0; text-align: right; padding: 3px 4px; min-height: 46px; display: flex; flex-direction: column; justify-content: space-between; }
.cal button.out { cursor: default; } .cal button.sel { background: var(--tint); }
.cal .d { font-size: 13px; } .cal .v { font-size: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; color: var(--sub); }

/* グラフ */
.chart { position: relative; margin: 6px 0; } .chart svg { display: block; width: 100%; height: auto; }
.chart.donut { max-width: 250px; margin: 0 auto; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--sub); margin: 6px 0; }
.legend i, .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.tip { position: absolute; pointer-events: none; background: #fff; color: #222; border: 1px solid #bbb; border-radius: 4px; padding: 5px 8px; font-size: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.15); white-space: nowrap; display: none; z-index: 5; }
.seg { display: inline-flex; border: 1px solid #c8c8c8; border-radius: var(--radius); overflow: hidden; margin: 4px 0; }
.seg button { background: var(--surface); border: 0; border-right: 1px solid #c8c8c8; padding: 6px 12px; } .seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--on-accent); font-weight: 700; }
tr.child td { font-size: 12px; color: var(--sub); background: var(--soft); } tr.child td:first-child { padding-left: 26px; }
tr.tap { cursor: pointer; }
.scroll { overflow-x: auto; }

/* 編集の画面 */
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet > div { background: var(--surface); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 12px 12px 0 0; padding: 16px 16px 22px; }
.grab { display: none; }
.sheet h4 { margin: 0 0 2px; font-size: 15px; } .sheet label { display: block; font-size: 12px; font-weight: 700; margin: 12px 0 4px; }
.sheet select, .sheet input[type=text], .sheet input[type=number], .sheet input[type=date] { width: 100%; border: 1px solid #c8c8c8; border-radius: var(--radius); padding: 8px; background: var(--surface); font-size: 16px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.check { display: flex !important; align-items: center; gap: 8px; font-weight: 400 !important; font-size: 14px !important; }
.check input { width: 18px; height: 18px; }
.actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: #333; color: #fff; padding: 9px 14px; border-radius: 6px; font-size: 13px; z-index: 30; max-width: 92vw; }

.lock { max-width: 340px; margin: 16vh auto 0; padding: 0 20px; text-align: center; }
.lock h2 { border: 0; }
.lock input[type=password] { width: 100%; border: 1px solid #c8c8c8; border-radius: var(--radius); padding: 10px; margin: 14px 0 8px; font-size: 16px; background: var(--surface); }
.lock .err { color: #b3261e; min-height: 20px; font-size: 13px; }

/* デザインごとに出し分ける部品（土台では出さない） */
.gear, #menuBtn, .sbar, .sclose, .chev { display: none; }
.cbody { min-width: 0; }

/* ============ PC用（自分用のページだけ。IBM風は別の配置）: 左にメニュー、中身は2列 ============ */
@media (min-width: 900px) {
  body.role-owner:not(.theme-ibm) header { position: fixed; inset: 0 auto 0 0; width: 220px; border-bottom: 0; border-right: 1px solid var(--line); overflow-y: auto; }
  body.role-owner:not(.theme-ibm) .brand { padding: 20px 18px 14px; }
  body.role-owner:not(.theme-ibm) nav { flex-direction: column; padding: 4px 10px; overflow: visible; }
  body.role-owner:not(.theme-ibm) nav button { flex: none; display: flex; align-items: center; gap: 10px; text-align: left; padding: 10px 12px; font-size: 14px; border-bottom: 0; border-left: 3px solid transparent; }
  body.role-owner:not(.theme-ibm) nav button svg { display: block; width: 20px; height: 20px; flex: none; }
  body.role-owner:not(.theme-ibm) nav button.on { border-left-color: var(--accent); background: var(--soft); }
  body.role-owner:not(.theme-ibm) .wrap { margin-left: 220px; max-width: 1180px; padding: 6px 32px 60px; }
  body.role-owner:not(.theme-ibm) .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 28px; align-items: start; }
  body.role-owner:not(.theme-ibm) .grid .wide { grid-column: 1 / 3; }
  body.role-owner:not(.theme-ibm) .grid.side { grid-template-columns: 400px minmax(0, 1fr); }
  body.role-owner:not(.theme-ibm) .grid.side > .card:first-child { position: sticky; top: 8px; }
  body.role-owner:not(.theme-ibm) .month { justify-content: flex-start; } body.role-owner:not(.theme-ibm) .period { text-align: left; }
  body.role-owner:not(.theme-ibm) .hero { text-align: left; }
  body.role-owner:not(.theme-ibm) .sheet { align-items: center; } body.role-owner:not(.theme-ibm) .sheet > div { border-radius: 12px; }
  body.role-owner .toast { bottom: 24px; }
}

/* ============ Apple風（theme-apple）: Human Interface Guidelines に合わせた配置 ============
   スマホ: 大きな題名 → 下に浮いたタブバー（5つ）、設定は右上のボタン。区切りのある一覧（題名は外、中身は角丸の白い面）。
   編集は下から出るシートで、上に「キャンセル／保存」。押す場所は 44px 以上、本文 17px。PC: タブバーが左のサイドバーになる。 */
.theme-apple {
  --accent: #0088ff; --ink: #000; --sub: #636366; --muted: #8e8e93; --line: #e5e5ea; --hair: #e0e0e5;
  --bg: #f2f2f7; --surface: #fff; --soft: #f2f2f7; --tint: #e5f2ff; --warn-bg: #fff4dc; --radius: 12px; --fill: rgba(118,118,128,.12);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Yu Gothic UI", sans-serif;
  font-size: 17px; line-height: 1.3;
}
.theme-apple header { background: transparent; border: 0; position: static; }
.theme-apple .brand { display: none; }
.theme-apple .wrap { padding: 0 16px 120px; }
.theme-apple .pagehead { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; padding-top: 10px; }
.theme-apple .title { display: block; font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: .01em; margin: 6px 0; }
.theme-apple .gear { display: grid; place-items: center; width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.theme-apple .month { grid-column: 1 / 3; justify-content: flex-start; margin: 4px 0 2px; gap: 6px; }
.theme-apple .month select { font-size: 17px; font-weight: 600; background: var(--surface); border-radius: 999px; padding: 0 16px; height: 44px; }
.theme-apple .month button { border: 0; background: var(--surface); border-radius: 50%; width: 44px; height: 44px; padding: 0; color: var(--accent); font-size: 24px; }
.theme-apple .period { text-align: left; font-size: 13px; color: var(--muted); margin: 6px 4px 0; }

/* 区切りのある一覧: 題名は外、中身は白い面 */
.theme-apple .card { margin: 26px 0 0; }
.theme-apple h2 { font-size: 20px; line-height: 25px; font-weight: 600; border: 0; margin: 0 4px 8px; padding: 0; }
.theme-apple h2 small { display: block; margin: 1px 0 0; font-size: 13px; line-height: 18px; color: var(--muted); }
.theme-apple .cbody { background: var(--surface); border-radius: 16px; padding: 4px 16px; }
.theme-apple .cbody > .chart { padding-top: 12px; } .theme-apple .cbody > .note:last-child, .theme-apple .cbody > .legend { padding-bottom: 8px; }
.theme-apple h3 { border: 0; padding: 0; font-size: 13px; color: var(--muted); font-weight: 600; margin: 18px 0 2px; }
.theme-apple .note { font-size: 13px; line-height: 18px; color: var(--muted); }

.theme-apple .hero { background: var(--surface); border: 0; border-radius: 22px; padding: 18px 20px 6px; margin: 14px 0 0; text-align: left; }
.theme-apple .hero .lab { font-size: 15px; font-weight: 400; color: var(--sub); }
.theme-apple .hero .big { font-family: ui-rounded, "SF Pro Rounded", var(--font); font-size: 48px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; }
.theme-apple .chip { border: 0; background: var(--fill); color: var(--sub); padding: 5px 12px; font-size: 13px; font-weight: 600; margin-top: 6px; }
.theme-apple .chip.ok { background: #dcf5e2; color: #17722b; } .theme-apple .chip.plan { background: #ffecd2; color: #8a4b00; }
.theme-apple .pair { margin-top: 14px; border-top: 1px solid var(--hair); }
.theme-apple .pair > div { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; border-bottom: 1px solid var(--hair); }
.theme-apple .pair > div:last-child { border-bottom: 0; }
.theme-apple .pair span { font-size: 15px; color: var(--sub); } .theme-apple .pair b { font-weight: 600; font-variant-numeric: tabular-nums; }

.theme-apple .btn { border: 0; background: var(--fill); border-radius: 999px; padding: 0 18px; font-weight: 600; min-height: 44px; color: var(--accent); }
.theme-apple .btn.primary { background: var(--accent); color: #fff; } .theme-apple .btn.danger { color: #ff383c; }
.theme-apple th, .theme-apple td { border: 0; border-bottom: 1px solid var(--hair); padding: 12px 0 12px 8px; } .theme-apple td:first-child, .theme-apple th:first-child { padding-left: 0; }
.theme-apple th { color: var(--muted); font-weight: 400; font-size: 13px; } .theme-apple tr > th:first-child:not(:only-child) { color: var(--ink); font-size: 15px; }
.theme-apple table tr:last-child td, .theme-apple table tr:last-child th { border-bottom: 0; }
.theme-apple tr.sum td { background: none; font-weight: 600; } .theme-apple tr.grand td { background: none; font-size: 17px; font-weight: 700; }
.theme-apple tr.child td { background: none; font-size: 15px; } .theme-apple .settle th, .theme-apple .settle td { font-size: 15px; padding: 11px 0 11px 6px; }
.theme-apple .tx { grid-template-columns: minmax(0, 1fr) auto 12px; padding: 10px 0; min-height: 60px; align-items: center; }
.theme-apple div.tx { grid-template-columns: minmax(0, 1fr) auto; }
.theme-apple .tx .meta { font-size: 13px; color: var(--muted); grid-column: 1 / 3; }
.theme-apple .chev { display: block; grid-column: 3; grid-row: 1 / 3; color: #c7c7cc; font-size: 22px; text-align: right; }
.theme-apple .tx:last-of-type { border-bottom: 0; }
.theme-apple .tag { border: 0; background: var(--fill); border-radius: 999px; padding: 1px 8px; font-size: 12px; } .theme-apple .tag.warn { background: #ffecd2; color: #8a4b00; }
.theme-apple .more { margin: 0; border-top: 1px solid var(--hair); text-align: left; } .theme-apple .more:has(.btn) { border: 0; padding: 8px 0 12px; }
.theme-apple .more button:not(.btn) { color: var(--accent); text-decoration: none; min-height: 44px; width: 100%; text-align: left; }
.theme-apple .alert button { color: var(--accent); text-decoration: none; font-weight: 600; }
.theme-apple .alert { border: 0; border-radius: 16px; padding: 12px 16px; background: var(--warn-bg); margin: 14px 0 0; font-size: 15px; color: #5c3a00; }
.theme-apple .filters select, .theme-apple .filters input, .theme-apple .sdate input, .theme-apple .sheet select, .theme-apple .sheet input[type=text], .theme-apple .sheet input[type=number], .theme-apple .sheet input[type=date], .theme-apple .lock input[type=password] { border: 0; background: var(--fill); border-radius: 10px; padding: 0 12px; min-height: 44px; font-size: 17px; }
.theme-apple .filters, .theme-apple .sdate { margin: 12px 0; }
.theme-apple .cal { border: 0; gap: 2px; padding: 8px 0; } .theme-apple .cal > * { border: 0; }
.theme-apple .cal .wd { color: var(--muted); font-weight: 600; font-size: 12px; }
.theme-apple .cal button { border-radius: 12px; background: none; min-height: 50px; align-items: center; text-align: center; padding: 5px 0; }
.theme-apple .cal .d { font-size: 17px; } .theme-apple .cal .v { font-size: 10px; }
.theme-apple .cal button.sel { background: var(--accent); color: #fff; } .theme-apple .cal button.sel .v { color: #fff; }
.theme-apple .meter { height: 6px; background: var(--fill); }
.theme-apple .seg { display: flex; border: 0; background: var(--fill); border-radius: 9px; padding: 2px; margin: 12px 0; }
.theme-apple .seg button { flex: 1; border: 0; background: none; border-radius: 7px; min-height: 32px; padding: 4px 8px; font-size: 15px; }
.theme-apple .seg button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.14); }
.theme-apple .subseg { margin: 14px 0 0; }
.theme-apple .tip { border: 0; border-radius: 12px; box-shadow: 0 4px 18px rgba(0,0,0,.18); }

/* 編集のシート: つまみ、上にキャンセル／保存 */
.theme-apple .sheet > div { border-radius: 20px 20px 0 0; padding: 6px 16px calc(24px + env(safe-area-inset-bottom)); background: #f2f2f7; }
.theme-apple .grab { display: block; width: 36px; height: 5px; border-radius: 3px; background: #c7c7cc; margin: 0 auto 2px; }
.theme-apple .sbar { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 44px; margin: 0 -6px 8px; }
.theme-apple .sbar button { border: 0; background: none; color: var(--accent); min-height: 44px; padding: 0 6px; font-size: 17px; justify-self: start; }
.theme-apple .sbar .go { justify-self: end; font-weight: 600; } .theme-apple .sbar b { font-weight: 600; }
.theme-apple .sheet h4 { font-size: 20px; line-height: 25px; margin: 4px 0; } .theme-apple .sheet label { font-size: 13px; font-weight: 400; color: var(--sub); margin: 14px 4px 6px; }
.theme-apple .sheet select, .theme-apple .sheet input[type=text], .theme-apple .sheet input[type=number], .theme-apple .sheet input[type=date] { background: #fff; }
.theme-apple .check { font-size: 17px !important; color: var(--ink) !important; min-height: 44px; background: #fff; border-radius: 10px; padding: 0 12px; margin: 8px 0 0 !important; }
.theme-apple .check input { width: 22px; height: 22px; accent-color: var(--accent); }
.theme-apple .actions [data-x=cancel], .theme-apple .actions [data-x=save] { display: none; }
.theme-apple .actions .btn.danger { flex: 1; background: #fff; border-radius: 10px; }
.theme-apple .toast { border-radius: 999px; background: rgba(40,40,42,.92); bottom: 104px; font-size: 15px; }

  // 店名をくらべやすい形にそろえる（全角半角・ひらがな/カタカナ・小さい「ッ」・長音や記号の違いを無視）

      const c = String(r[2] || "").trim();
      let holder, amount;
      if (c === "ご本人" || c === "ご家族") { holder = c === "ご本人" ? "本人" : "家族"; amount = toNum(r[6]); if (amount == null) amount = toNum(r[7]); }
      else { holder = !section || section === first ? "本人" : "家族"; amount = toNum(r[2]); if (amount == null) amount = toNum(r[5]); }
      if (amount == null) continue;
      if (holder !== "家族") continue;   // 本人カードは対象外。読み込みの時点で捨てる
      const key = `${date}_${norm(name)}_${amount}`;
      seen[key] = (seen[key] || 0) + 1;
      // 表示用の店名は全角英数字を半角にそろえる（ＮＦＣ → NFC）
      txns.push({ id: `${key}_${seen[key]}`, date, name: name.normalize("NFKC").replace(/\s+/g, " "), holder, amount });
    }
    txns.sort((x, y) => (x.date < y.date ? -1 : x.date > y.date ? 1 : 0));
    return txns;
  }
  // 家族カードの行だけにしたCSVを作る（保存用。本人カードの利用を残さないため）
  function toCsv(txns) {
    const q = (v) => (/[",\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v);
    return txns.map((t) => [t.date.replace(/-/g, "/"), q(t.name), "ご家族", "1回払い", "", "", t.amount, t.amount].join(",")).join("\r\n") + "\r\n";
  }
  // そのCSVが何月分か（利用日がいちばん多い月）
  function monthOf(txns) {
    const c = {}; let best = null;
    for (const t of txns) { const m = t.date.slice(0, 7); c[m] = (c[m] || 0) + 1; if (!best || c[m] > c[best]) best = m; }
    return best;
  }

  // ---- 分類 ----
  // 優先順: 手修正 > マネーフォワードのルール（店名一致）> キーワード（下の行が優先）> 辞書（長い語が優先）> AIの推測 > 未分類
  function prepRules(rules) {
    const mf = (rules.mf || []).map((r) => ({ n: norm(r.name), cat: r.cat })).filter((r) => r.n);
    const keywords = (rules.keywords || []).map((r) => ({ n: norm(r.kw), cat: r.cat, shared: !!r.shared })).filter((r) => r.n);
    const dict = (rules.dict || []).map((r) => ({ n: norm(r[0]), cat: r[1] })).filter((r) => r.n.length >= 2).sort((a, b) => b.n.length - a.n.length);
    const mfExact = {}; for (const r of mf) if (!(r.n in mfExact)) mfExact[r.n] = r.cat;
    return { mf, mfExact, keywords, dict, ai: rules.ai || {} };
  }
  function classify(name, P) {
    const n = norm(name);
    let shared = false, kw = null;
    for (const r of P.keywords) if (n.includes(r.n)) { kw = r; if (r.shared) shared = true; }
    if (P.mfExact[n]) return { cat: P.mfExact[n], src: "ルール", shared };
    for (const r of P.mf) if (r.n.length >= 5 && n.includes(r.n)) return { cat: r.cat, src: "ルール", shared };
    if (kw) return { cat: kw.cat, src: "キーワード", shared };
    for (const r of P.dict) if (n.includes(r.n)) return { cat: r.cat, src: "推測", shared };
    if (P.ai[n] && P.ai[n] !== UNKNOWN) return { cat: P.ai[n], src: "AI推測", shared };
    return { cat: UNKNOWN, src: "未分類", shared };
  }
  // マネーフォワード式の分類 → 家計の集計表の分類
  function hcatOf(cat) {
    const [big, mid] = String(cat).split(">");
    if (big === "食費") return { 食料品: "スーパー", 外食: "外食", 会社ランチ: "外食", カフェ: "カフェ", コンビニ: "コンビニ", 惣菜: "惣菜" }[mid] || "その他";
    if (big === "日用品") return "日用品";
    if (big === "水道・光熱費") return "光熱費";
    return "その他";
  }

  // ---- 1か月分の計算 ----
  // overrides[id] = { cat, hcat, shared, r, a, memo }（どれも省略可） / manual = カード以外の支出
  function computeMonth(txns, P, overrides, manual, cfg) {
    overrides = overrides || {}; manual = manual || [];
    const util = cfg.utilityPartnerRatio == null ? 0.4 : cfg.utilityPartnerRatio;
    const share = (amount, hcat, o) => {
      let a;
      if (o && o.a != null) a = o.a; else if (o && o.r != null) a = amount - o.r;
      else a = amount * (hcat === "光熱費" ? util : 0.5);
      return a;
    };
    const rows = txns.map((t) => {
      const o = overrides[t.id] || {}, c = classify(t.name, P);
      const cat = o.cat || c.cat, src = o.cat ? "手修正" : c.src;
      const shared = o.shared != null ? !!o.shared : true;   // 家族カードの利用は、外さないかぎり家計（折半）に入る
      const hcat = o.hcat || hcatOf(cat);
      const row = { ...t, cat, src, shared, hcat, memo: o.memo || "", custom: o.a != null || o.r != null };
      if (shared) { row.a = share(t.amount, hcat, o); row.r = t.amount - row.a; }
      return row;
    });
    const extra = manual.map((m) => { const a = share(m.amount, m.hcat, m); return { ...m, shared: true, manual: true, a, r: m.amount - a, custom: m.a != null || m.r != null }; });

    const table = HCATS.map((h) => {
      const list = rows.filter((r) => r.shared && r.hcat === h).concat(extra.filter((r) => r.hcat === h));
      const total = list.reduce((s, r) => s + r.amount, 0);
      const sum = Math.round(list.reduce((s, r) => s + r.a, 0) * 100) / 100;
      // 相手の分は端数を切り捨て（光熱費は10円未満を切り捨て）。端数は自分の分に入る
      const a = h === "光熱費" ? Math.floor(sum / 10) * 10 : Math.floor(sum);
      return { hcat: h, total, r: total - a, a, count: list.length };
    });
    const living = table.reduce((s, x) => ({ total: s.total + x.total, r: s.r + x.r, a: s.a + x.a }), { total: 0, r: 0, a: 0 });
    const rent = { r: (cfg.rent && cfg.rent.r) || 0, a: (cfg.rent && cfg.rent.a) || 0 };
    rent.total = rent.r + rent.a;
    const grand = { total: living.total + rent.total, r: living.r + rent.r, a: living.a + rent.a };
    const dates = txns.map((t) => t.date).sort();
    return {
      rows, extra,
      settlement: { table, living, rent, grand, from: dates[0] || null, to: dates[dates.length - 1] || null },
      checks: {
        unknown: rows.filter((r) => r.src === "未分類").length,
        guessed: rows.filter((r) => r.src === "推測" || r.src === "AI推測").length,
        sharedOther: rows.filter((r) => r.shared && r.hcat === "その他").length,
      },
    };
  }

  return { HCATS, TAXONOMY, UNKNOWN, norm, parseCsv, parseCard, toCsv, monthOf, prepRules, classify, hcatOf, computeMonth };
});

  // ---------- 保存先（GitHub の非公開リポジトリ / PC での確認用サーバー） ----------
  const b64e = (bytes) => { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };

        ...opt, headers: { Authorization: `Bearer ${B.token}`, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" } });

    async read(path) {

    cols.forEach((c, i) => {

        g += `<path d="M${cx - bw / 2},${y1 + h} v${-(h - rr)} q0,${-rr} ${rr},${-rr} h${bw - 2 * rr} q${rr},0 ${rr},${rr} v${h - rr} z" fill="${series[k].color}"/>`;

      (series.length > 1 ? `<div class="legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>` : "");
  }
  function donut(parts, total) {
    const R = 86, r = 52, C = 100; let a = -Math.PI / 2, g = "";
    const pt = (rad, ang) => `${C + rad * Math.cos(ang)},${C + rad * Math.sin(ang)}`;
    for (const p of parts) {
      const d = (p.value / total) * Math.PI * 2, b = a + Math.min(d, Math.PI * 2 - 0.0001), big = d > Math.PI ? 1 : 0;
      g += `<path d="M${pt(R, a)} A${R},${R} 0 ${big} 1 ${pt(R, b)} L${pt(r, b)} A${r},${r} 0 ${big} 0 ${pt(r, a)} Z" fill="${p.color}" stroke="#fff" stroke-width="2" ${tipAttr(`${esc(p.name)}<br><b>${yen(p.value)}</b>（${(p.value / total * 100).toFixed(1)}%）`)}/>`;
      a += d;
    }
    return `<div class="chart donut"><svg viewBox="0 0 200 200" role="img" aria-label="分類ごとの割合">${g}
      <text x="100" y="94" text-anchor="middle" font-size="11" fill="#52514e">生活費 計</text><text x="100" y="114" text-anchor="middle" font-size="16" font-weight="700" fill="#222">${yen(total)}</text></svg></div>`;
  }

  // ---------- 画面: ホーム ----------
  function viewHome() {
    const c = calc(S.month), s = c.settlement, rows = c.rows, ibm = theme() === "ibm";
    const sum = (list) => list.reduce((a, r) => a + r.amount, 0);
    const cardUse = sum(rows.filter((r) => r.shared)), other = sum(c.extra);
    const pm = prevMonth(), pc = pm ? calc(pm) : null;
    const [y, m] = S.month.split("-").map(Number), days = new Date(y, m, 0).getDate(), cols = [];
    for (let d = 1; d <= days; d++) {
      const key = `${S.month}-${String(d).padStart(2, "0")}`, v = sum(rows.filter((r) => r.shared && r.date === key)) + sum(c.extra.filter((r) => r.date === key));
      cols.push({ label: d === 1 || d % 5 === 0 ? `${d}日` : "", values: [v], tip: `<b>${m}/${d}</b><br>${yen(v)}` });
    }
    const need = c.checks.unknown + c.checks.guessed;
    const use = (label, now, before) => `<tr><th>${label}</th><td>${yen(now)}</td>${pc ? `<td>${diff(now, before).replace(/<\/?small[^>]*>/g, "")}</td>` : ""}</tr>`;
    const alert = need ? `<div class="alert">分類の確認が必要な明細が ${need} 件あります（未分類 ${c.checks.unknown}・推測 ${c.checks.guessed}）。 <button data-act="review">確認する</button></div>` : "";
    const spend = card("家計の支出", "家賃をのぞく", `<table>${pc ? "<tr><th></th><th>今月</th><th>前月比</th></tr>" : ""}${use("家族カードの利用", cardUse, pc && sum(pc.rows.filter((r) => r.shared)))}${use("カード以外の支出", other, pc && sum(pc.extra))}${use("生活費 計", s.living.total, pc && pc.settlement.living.total)}</table>
        <div class="more"><button data-act="tab" data-v="settle">精算のくわしい表を見る ›</button></div>`);
    const daily = card("日ごとの支出", "", barChart(cols, [{ name: "家計", color: "var(--s1)" }], { label: "日ごとの家計の支出", maxBar: 14 }));
    const latest = card("最新の明細", "", txList(rows.slice(-5).reverse().map(rowItem), "edit") + `<div class="more"><button data-act="tab" data-v="list">明細をすべて見る ›</button></div>`, "wide");
    // IBM風は グラフ（広い）→ 支出 → 明細の表。ほかは 支出 → グラフ → 明細
    return `${period(s)}${hero(s)}${alert}<div class="grid ${ibm ? "g21" : ""}">${ibm ? daily + spend : spend + daily}${latest}</div>`;
  }

  // ---------- 画面: 家計（カレンダーと明細） ----------
  function viewList() {
    const c = calc(S.month), [y, m] = S.month.split("-").map(Number), th = theme();
    const first = new Date(y, m - 1, 1).getDay(), days = new Date(y, m, 0).getDate();
    let cal = WD.map((w) => `<div class="wd">${w}</div>`).join("");
    for (let i = 0; i < first; i++) cal += `<button class="out" disabled></button>`;
    for (let d = 1; d <= days; d++) {
      const key = `${S.month}-${String(d).padStart(2, "0")}`, v = c.rows.filter((r) => r.date === key).reduce((a, r) => a + r.amount, 0);
      cal += `<button data-act="day" data-v="${key}" class="${S.day === key ? "sel" : ""}"><span class="d">${d}</span><span class="v">${v ? "-" + v.toLocaleString() : ""}</span></button>`;
    }
    const q = K.norm(S.q);
    const list = c.rows.filter((r) => (!S.day || r.date === S.day) && (!S.hcat || r.hcat === S.hcat) && (!q || K.norm(r.name).includes(q)) &&
      (S.scope === "all" || (S.scope === "review" && ["未分類", "推測", "AI推測"].includes(r.src)) || (S.scope === "off" && !r.shared) || (S.scope === "custom" && r.custom))).reverse();
    const opt = (v, t, cur) => `<option value="${esc(v)}" ${v === cur ? "selected" : ""}>${esc(t)}</option>`;
    const calCard = card("カレンダー", "日付を押すと、その日の明細だけになります", `<div class="cal">${cal}</div>`, "k-cal");
    const listCard = card("明細", `${list.length}件・合計 ${yen(list.reduce((a, r) => a + r.amount, 0))}`, `
      <div class="filters"><select data-chg="scope" aria-label="しぼりこみ">${[["all", "全て"], ["review", "要確認"], ["off", "対象外にしたもの"], ["custom", "分け方を指定"]].map(([v, t]) => opt(v, t, S.scope)).join("")}</select>
        <select data-chg="hcat" aria-label="分類">${opt("", "分類：全て", S.hcat)}${K.HCATS.map((b) => opt(b, b, S.hcat)).join("")}</select>
        <input data-inp="q" placeholder="店名でさがす" value="${esc(S.q)}">${S.day ? `<button class="btn" data-act="day" data-v="">${md(S.day)} ✕</button>` : ""}</div>
      <div id="txlist">${list.length ? txList(list.map(rowItem), "edit") : '<p class="note">当てはまる明細はありません。</p>'}</div>
      <p class="note">明細を押すと、分類・家計に入れるかどうか・負担の分け方を直せます。</p>`, "k-tx");
    // せまい画面では、Apple風は切り替えボタン（カレンダーが先）、IBM風はタブ（明細の表が先）で1つずつ見せる
    const sub = S.sub || (th === "ibm" ? "tx" : "cal");
    const sw = (k, t) => `<button data-act="sub" data-v="${k}" class="${sub === k ? "on" : ""}">${t}</button>`;
    if (th === "apple") return `<div class="seg subseg">${sw("cal", "カレンダー")}${sw("tx", "明細")}</div><div class="grid side sub-${sub}">${calCard}${listCard}</div>`;
    if (th === "ibm") return `<div class="ltabs">${sw("tx", "明細")}${sw("cal", "カレンダー")}</div><div class="grid g21 sub-${sub}">${listCard}${calCard}</div>`;
    return `<div class="grid side">${calCard}${listCard}</div>`;
  }

  // ---------- 画面: 予算 ----------
  function viewBudget() {
    const c = calc(S.month), B = D.budget, used = (k) => c.settlement.table.find((x) => x.hcat === k).total;
    const meter = (u, b, over) => `<span class="meter${over ? " over" : ""}"><i style="width:${b ? Math.min(100, u / b * 100) : 100}%"></i></span>`;
    const line = (key) => {
      const b = B[key], u = used(key), over = b != null && u > b;
      return `<button class="tx" data-act="budget" data-v="${esc(key)}"><span class="name"><i class="dot" style="background:${color(key)}"></i>${esc(key)}</span><span class="amt">${yen(u)}${b != null ? ` / ${yen(b)}` : ""}</span>
        ${b != null ? `${meter(u, b, over)}<span class="meta">${over ? `⚠ ${yen(u - b)} 超過` : `残り ${yen(b - u)}`}</span>` : '<span class="meta">予算なし（押すと設定できます）</span>'}<span class="chev" aria-hidden="true">›</span></button>`;
    };
    const trow = (key) => {
      const b = B[key], u = used(key), over = b != null && u > b;
      return `<tr class="tap" data-act="budget" data-v="${esc(key)}"><td class="c-n"><span class="name"><span class="swatch" style="background:${color(key)}"></span>${esc(key)}</span>${b != null ? meter(u, b, over) : ""}</td><td>${yen(u)}</td><td>${b != null ? yen(b) : "—"}</td><td>${b == null ? "—" : over ? `⚠ −${yen(u - b)}` : yen(b - u)}</td></tr>`;
    };
    const keys = Object.keys(B), bt = keys.reduce((a, k) => a + B[k], 0), ut = keys.reduce((a, k) => a + used(k), 0);
    const total = keys.length ? `<table><tr><th>予算の合計</th><td>${yen(bt)}</td></tr><tr><th>予算のある分類の支出</th><td>${yen(ut)}</td></tr><tr><th>${ut > bt ? "⚠ 超過" : "残り"}</th><td>${yen(Math.abs(bt - ut))}</td></tr></table>` : "";
    const body = theme() === "ibm" ? `<div class="scroll"><table class="dt"><tr><th class="c-n">分類</th><th>支出</th><th>予算</th><th>残り</th></tr>${K.HCATS.map(trow).join("")}</table></div>` : K.HCATS.map(line).join("");
    return `<div class="grid">${card("家計の予算", "2人の合計・家賃をのぞく", `${total}${body}<p class="note">分類を押すと、1か月の予算を決められます。</p>`, "wide")}</div>`;
  }
  function editBudget(key) {
    const cur = D.budget[key];
    const el = sheet(`<h4>「${esc(key)}」の予算</h4><div class="note">家計（2人の合計）・1か月あたり。空欄にすると「予算なし」に戻ります。</div>
      <label>予算（円）</label><input type="number" id="bAmt" inputmode="numeric" value="${cur != null ? cur : ""}">
      <div class="actions"><button class="btn" data-x="cancel">やめる</button><button class="btn primary" data-x="save">保存する</button></div>`);
    $("[data-x=cancel]", el).onclick = closeSheet;
    $("[data-x=save]", el).onclick = async () => {
      const val = numOrNull($("#bAmt", el).value);
      if (val != null && !(val >= 0)) return toast("0以上の金額を入れてください");
      const fn = (c) => { const n = { ...c }; if (val == null) delete n[key]; else n[key] = val; return n; };
      if (await save("data/budget.json", D.budget, fn, `予算: ${key} ${val == null ? "なし" : val + "円"}`, (x) => { D.budget = x; })) { closeSheet(); render(); }
    };
  }

  // ---------- 画面: 分析（内訳・月次推移） ----------
  function viewAnalysis() {
    const c = calc(S.month), t = c.settlement.table, total = c.settlement.living.total, ibm = theme() === "ibm";
    const all = c.rows.filter((r) => r.shared).concat(c.extra.map((x) => ({ ...x, cat: "カード以外の支出" })));
    const table = t.filter((x) => x.total).sort((a, b) => b.total - a.total).map((x) => {
      const mids = {}; all.filter((r) => r.hcat === x.hcat).forEach((r) => { mids[r.cat] = (mids[r.cat] || 0) + r.amount; });
      // IBM風は円グラフのかわりに、表の中に横棒を出す
      const bar = ibm ? `<span class="meter"><i style="width:${x.total / total * 100}%;background:${color(x.hcat)}"></i></span>` : "";
      return `<tr class="tap" data-act="open" data-v="${esc(x.hcat)}"><td><span class="swatch" style="background:${color(x.hcat)}"></span>${esc(x.hcat)} ${S.open[x.hcat] ? "▾" : "▸"}${bar}</td><td>${yen(x.total)}</td><td>${(x.total / total * 100).toFixed(1)}%</td></tr>` +
        (S.open[x.hcat] ? Object.entries(mids).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<tr class="child"><td>${esc(k.replace(">", "＞"))}</td><td>${yen(v)}</td><td>${(v / total * 100).toFixed(1)}%</td></tr>`).join("") : "");
    }).join("");
    const series = K.HCATS.map((h) => ({ name: h, color: color(h) }));
    const per = months().map((mo) => ({ mo, s: calc(mo).settlement }));
    const cols = per.map((x) => ({ label: `${+x.mo.slice(5)}月`, values: x.s.table.map((r) => r.total), tip: `<b>${mlabel(x.mo)}</b><br>` + x.s.table.filter((r) => r.total).map((r) => `${esc(r.hcat)} ${yen(r.total)}`).join("<br>") }));
    const trend = `<div class="scroll"><table style="min-width:${130 + 92 * per.length}px"><tr><th>分類</th>${per.map((x) => `<th>${+x.mo.slice(5)}月</th>`).join("")}</tr>
      ${K.HCATS.map((h, i) => `<tr><td><span class="swatch" style="background:${color(h)}"></span>${esc(h)}</td>${per.map((x) => `<td>${yen(x.s.table[i].total)}</td>`).join("")}</tr>`).join("")}
      <tr class="sum"><td>生活費 計</td>${per.map((x) => `<td>${yen(x.s.living.total)}</td>`).join("")}</tr></table></div>`;
    const parts = card("内訳", "家計の生活費（家賃をのぞく）", total ? (ibm ? "" : donut(t.filter((x) => x.total).map((x) => ({ name: x.hcat, color: color(x.hcat), value: x.total })), total)) +
        `<table><tr><th>分類</th><th>金額</th><th>割合</th></tr>${table}<tr class="sum"><td>生活費 計</td><td>${yen(total)}</td><td>100%</td></tr></table><p class="note">行を押すと、くわしい分類が開きます。</p>` : '<p class="note">この月の支出はありません。</p>');
    const trendCard = card("月次推移", "月ごとの生活費", barChart(cols, series, { label: "月ごとの分類別の生活費", maxBar: 56 }) + trend);
    return `<div class="grid ${ibm ? "g21" : ""}">${ibm ? trendCard + parts : parts + trendCard}</div>`;
  }

  // ---------- 画面: 精算（集計） ----------
  function viewSettle() {
    const c = calc(S.month), s = c.settlement, pm = prevMonth(), prev = pm ? calc(pm).settlement : null, st = settleState(S.month), P2 = D.cfg.partner;
    if (D.role === "partner") {
      // 配偶者用: いちばん上に負担額、その下に集計の表と、折半の対象になった明細（見るだけ）
      const items = (D.pre[S.month].items || []).slice().reverse().map((m) => ({ ...m, last: yen(m.a) }));
      return `${period(s)}${hero(s)}<div class="grid">${card("家計簿 集計", "", settleTable(s, prev), "wide")}
        ${card("家計の明細", "折半の対象になったもの", items.length ? txList(items, null, `${P2}の分`) : '<p class="note">この月の明細はありません。</p>', "wide")}</div>`;
    }
    const info = D.settled[S.month] || {};
    const extra = c.extra.slice().sort((x, y) => (x.date < y.date ? 1 : x.date > y.date ? -1 : 0)).map((m) => ({ ...m, last: yen(m.a), extra: m.custom ? '<span class="tag">分け方を指定</span>' : "" }));
    return `${period(s)}${hero(s)}<div class="grid ${theme() === "ibm" ? "g21" : ""}">

      ${card("精算日", `${esc(P2)}との精算をした日（これからの予定日でも入れられます）`, `
        <div class="sdate"><input type="date" id="sDate" value="${esc(info.date || "")}" aria-label="精算日"><button class="btn primary" data-act="sdate-save">保存する</button>${info.date ? '<button class="btn" data-act="sdate-clear">消す</button>' : ""}</div>
        <p class="note">いまの状態：<b>${st.text}</b>。配偶者用のページにも表示されます。</p>
        <h3>チェック</h3><table><tr><th>家計に入っている明細</th><td>${c.rows.filter((r) => r.shared).length + c.extra.length} 件</td></tr>
        <tr><th>家計の「その他」</th><td>${c.checks.sharedOther} 件</td></tr><tr><th>分類の確認が必要（未分類・推測）</th><td>${c.checks.unknown + c.checks.guessed} 件</td></tr></table>`)}
      ${card("カード以外の支出", "現金・別のカード・口座引き落とし（光熱費など）", `${extra.length ? txList(extra, "manual", P2) : '<p class="note">この月はまだありません。</p>'}
        <div class="more"><button class="btn primary" data-act="manual" data-v="">＋ 追加する</button></div>`, "wide")}</div>`;

  async function setSettled(date) {

      ${card("このページについて", "", `<table><tr><th>最終更新</th><td>${esc(D.builtAt)}</td></tr><tr><th>見られる月</th><td>${months().map(mlabel).join("、") || "なし"}</td></tr>
        <tr><th>保存先</th><td>${B.type === "github" ? "GitHub（非公開）" : B.type === "local" ? "このPC（確認用）" : "なし（見るだけ）"}</td></tr>

  // ---------- 編集 ----------
  const closeSheet = () => { const s = $(".sheet"); if (s) s.remove(); };
  // 編集の画面。Apple風は上に「キャンセル／保存」、IBM風は右上に×と下に大きなボタン（見た目は CSS で出し分け）
  function sheet(html) {
    closeSheet(); const el = document.createElement("div"); el.className = "sheet";
    el.innerHTML = `<div role="dialog" aria-modal="true"><span class="grab"></span><div class="sbar"><button data-p="cancel">キャンセル</button><b>編集</b><button data-p="save" class="go">保存</button></div><button class="sclose" data-p="cancel" aria-label="閉じる">✕</button>${html}</div>`;
    el.querySelectorAll("[data-p]").forEach((b) => { b.onclick = () => $(`[data-x=${b.dataset.p}]`, el).click(); });
    el.addEventListener("click", (e) => { if (e.target === el) closeSheet(); }); document.body.appendChild(el); return el;
  }
  const optList = (arr, cur) => arr.map((v) => `<option ${v === cur ? "selected" : ""}>${esc(v)}</option>`).join("");
  const numOrNull = (v) => (String(v).trim() === "" ? null : Number(v));

  function editTx(id) {
    const r = calc(S.month).rows.find((x) => x.id === id); if (!r) return;
    const o = D.overrides[id] || {}, auto = K.classify(r.name, P), [big, mid] = r.cat.split(">");
    const mids = (b) => [...new Set([...(K.TAXONOMY[b] || []), ...(b === big ? [mid] : [])])];
    const el = sheet(`<h4>${esc(r.name)}</h4><div class="note">${md(r.date)}・${yen(r.amount)}・自動の分類：${esc(auto.cat.replace(">", "＞"))}（${auto.src}）</div>
      <div class="row2"><div><label>大項目</label><select id="eBig">${optList(Object.keys(K.TAXONOMY), big)}</select></div><div><label>中項目</label><select id="eMid">${optList(mids(big), mid)}</select></div></div>
      <label class="check"><input type="checkbox" id="eRule"> 同じ店名は、今後もこの分類にする</label>
      <label class="check"><input type="checkbox" id="eShared" ${r.shared ? "checked" : ""}> 家計（折半）に入れる</label>
      <div id="eKakei"><label>集計表での分類</label><select id="eHcat"><option value="">自動（大項目・中項目から決める）</option>${optList(K.HCATS, o.hcat || "")}</select>
        <label>負担の分け方（空欄なら自動：半分ずつ、光熱費は6：4）</label><div class="row2"><input type="number" id="eR" inputmode="numeric" placeholder="${esc(D.cfg.owner)}の分" value="${o.r != null ? o.r : ""}"><input type="number" id="eA" inputmode="numeric" placeholder="${esc(D.cfg.partner)}の分" value="${o.a != null ? o.a : ""}"></div></div>
      <label>メモ</label><input type="text" id="eMemo" value="${esc(o.memo || "")}">
      <div class="actions"><button class="btn" data-x="cancel">やめる</button><button class="btn primary" data-x="save">保存する</button></div>`);
    const bigSel = $("#eBig", el), midSel = $("#eMid", el), sh = $("#eShared", el), box = $("#eKakei", el);
    const sync = () => { box.style.display = sh.checked ? "" : "none"; };
    bigSel.onchange = () => { midSel.innerHTML = optList(mids(bigSel.value), ""); };
    sh.onchange = sync; sync();
    $("[data-x=cancel]", el).onclick = closeSheet;
    $("[data-x=save]", el).onclick = async () => {
      const cat = `${bigSel.value}>${midSel.value}`, n = {}, rr = numOrNull($("#eR", el).value), aa = numOrNull($("#eA", el).value);
      const addRule = $("#eRule", el).checked;
      if (cat !== auto.cat && !addRule) n.cat = cat;
      if (!sh.checked) n.shared = false;
      else { if ($("#eHcat", el).value) n.hcat = $("#eHcat", el).value; if (rr != null) n.r = rr; if (aa != null) n.a = aa; }
      if (n.r != null && n.a != null && n.r + n.a !== r.amount) return toast(`分け方の合計（${yen(n.r + n.a)}）が金額（${yen(r.amount)}）と合いません`);
      if ((n.r != null && (n.r < 0 || n.r > r.amount)) || (n.a != null && (n.a < 0 || n.a > r.amount))) return toast("分け方が金額をこえています");
      if ($("#eMemo", el).value.trim()) n.memo = $("#eMemo", el).value.trim();
      const btn = $("[data-x=save]", el); btn.disabled = true;
      let ok = true;
      if (addRule) ok = await save("rules/mf.json", D.rules.mf, (cur) => [{ name: r.name, cat }, ...cur.filter((x) => K.norm(x.name) !== K.norm(r.name))], `分類ルール: ${r.name} → ${cat}`, (v) => { D.rules.mf = v; P = K.prepRules(D.rules); });
      if (ok) ok = await save("data/overrides.json", D.overrides, (cur) => { const c = { ...cur }; if (Object.keys(n).length) c[id] = n; else delete c[id]; return c; }, `手修正: ${r.date} ${r.name}`, (v) => { D.overrides = v; });
      btn.disabled = false;
      if (ok) { dirty(); closeSheet(); render(); }
    };
  }

  function editManual(id) {
    const m = D.manual.find((x) => x.id === id) || { date: `${S.month}-01`, name: "", amount: "", hcat: "光熱費" };
    const el = sheet(`<h4>カード以外の支出</h4><div class="note">現金・別のカード・口座引き落としで払った、家計（折半）に入れる支出です。</div>
      <div class="row2"><div><label>日付</label><input type="date" id="mDate" value="${esc(m.date)}"></div><div><label>金額</label><input type="number" id="mAmt" inputmode="numeric" value="${esc(m.amount)}"></div></div>
      <label>内容</label><input type="text" id="mName" value="${esc(m.name)}"><label>分類</label><select id="mH">${optList(K.HCATS, m.hcat)}</select>
      <label>${esc(D.cfg.partner)}の分（空欄なら自動：半分、光熱費は4割）</label><input type="number" id="mA" inputmode="numeric" value="${m.a != null ? m.a : ""}">
      <div class="actions">${id ? '<button class="btn danger" data-x="del">削除</button>' : ""}<button class="btn" data-x="cancel">やめる</button><button class="btn primary" data-x="save">保存する</button></div>`);
    $("[data-x=cancel]", el).onclick = closeSheet;
    const commit = async (fn, msg) => { if (await save("data/manual.json", D.manual, fn, msg, (v) => { D.manual = v; })) { dirty(); closeSheet(); render(); } };
    if (id) $("[data-x=del]", el).onclick = () => commit((cur) => cur.filter((x) => x.id !== id), `カード以外の支出を削除: ${m.name}`);
    $("[data-x=save]", el).onclick = () => {
      const date = $("#mDate", el).value, amount = Number($("#mAmt", el).value), name = $("#mName", el).value.trim(), a = numOrNull($("#mA", el).value);
      if (!date || !name || !(amount > 0)) return toast("日付・内容・金額を入れてください");
      if (a != null && (a < 0 || a > amount)) return toast("分け方が金額をこえています");
      const n = { id: id || `m-${Date.now()}`, month: S.month, date, name, amount, hcat: $("#mH", el).value, ...(a != null ? { a } : {}) };
      commit((cur) => [...cur.filter((x) => x.id !== n.id), n], `カード以外の支出: ${name} ${amount}円`);
    };
  }

  async function upload() {
    const f = $("#csvFile").files[0]; if (!f) return toast("CSVファイルを選んでください");
    const bytes = new Uint8Array(await f.arrayBuffer());
    let text; try { text = new TextDecoder("utf-8", { fatal: true }).decode(bytes); } catch (e) { text = new TextDecoder("shift_jis").decode(bytes); }
    const txns = K.parseCard(text), mo = K.monthOf(txns);
    if (!txns.length) return toast("家族カードの明細が見つかりませんでした。CSVの種類を確認してください");
    const stamp = new Date().toISOString().replace(/\D/g, "").slice(0, 14);
    // 保存するのは家族カードの行だけにしたCSV（本人カードの利用は残さない）
    if (store.on) { try { await store.write(`csv/upload-${stamp}.csv`, new TextEncoder().encode(K.toCsv(txns)), null, `CSV取り込み: ${mo}（${txns.length}件）`); } catch (e) { return toast(`保存できませんでした：${e.message}`); } }
    D.months[mo] = { txns }; S.month = mo; S.tab = "home"; dirty(); render();
    toast(`${mlabel(mo)}分 ${txns.length}件を取り込みました${store.on ? "。配偶者用のページには1〜2分で反映されます" : "（確認用のため保存されません）"}`);
  }

  // ---------- 描画と操作 ----------
  const ic = (d) => `<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
  const TABS = [
    ["home", "ホーム", '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>'],
    ["list", "家計", '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'],
    ["budget", "予算", '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'],
    ["analysis", "分析", '<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>'],
    ["settle", "精算", '<circle cx="12" cy="12" r="9"/><path d="M8.5 7.5L12 12l3.5-4.5M12 12v5M9 12h6M9 14.5h6"/>'],
    ["setup", "取込", '<path d="M12 4v10M8 10l4 4 4-4"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>'],
  ];
  function render() {
    const owner = D.role === "owner";
    if (!S.month || !D.months[S.month]) S.month = months().pop();
    // メニュー。置き場所はデザインごとに CSS で変える（Apple風スマホ＝下のタブバー5つ＋右上のボタン、IBM風＝左から出るメニュー）
    $("#nav").innerHTML = owner ? TABS.map(([k, v, d]) => `<button data-act="tab" data-v="${k}" class="${S.tab === k ? "on" : ""}${k === "setup" ? " aux" : ""}" ${S.tab === k ? 'aria-current="page"' : ""}>${ic(d)}<span>${v}</span></button>`).join("") : "";
    $("#brandNote").textContent = owner ? "" : `${D.cfg.owner}・${D.cfg.partner}`;
    const hasMonth = S.month && (!owner || S.tab !== "setup");
    const head = `<div class="pagehead"><h1 class="title">${owner ? TABS.find((t) => t[0] === S.tab)[1] : esc(D.cfg.title || "家計簿")}</h1>
      ${owner && S.tab !== "setup" ? `<button class="gear" data-act="tab" data-v="setup" aria-label="取り込み・設定">${ic(TABS[5][2])}</button>` : ""}${hasMonth ? monthBar() : ""}</div>`;
    if (!S.month) { app.innerHTML = head + (owner ? viewSetup() : '<p class="note">まだデータがありません。</p>'); return; }
    app.innerHTML = head + (!owner ? viewSettle() : { home: viewHome, list: viewList, budget: viewBudget, analysis: viewAnalysis, settle: viewSettle, setup: viewSetup }[S.tab]());
  }
  document.addEventListener("click", (e) => {
    const body = document.body;
    if (body.classList.contains("nav-open") && !e.target.closest("#nav, #menuBtn")) body.classList.remove("nav-open");
    const b = e.target.closest("[data-act]"); if (!b) return;
    const a = b.dataset.act, v = b.dataset.v;
    if (a === "menu") return void body.classList.toggle("nav-open");
    if (a === "tab") { S.tab = v; body.classList.remove("nav-open"); window.scrollTo(0, 0); }
    else if (a === "sub") S.sub = v;
    else if (a === "month") { if (v) { S.month = v; S.day = null; } }
    else if (a === "day") { S.day = S.day === v ? null : v || null; if (S.day) S.sub = "tx"; }
    else if (a === "review") { S.tab = "list"; S.sub = "tx"; S.scope = "review"; S.day = null; S.hcat = ""; S.q = ""; }
    else if (a === "open") S.open[v] = !S.open[v];
    else if (a === "theme") { try { localStorage.setItem(THEMEKEY, v); } catch (x) {} S.sub = null; applyTheme(); }
    else if (a === "edit") return editTx(v);
    else if (a === "manual") return editManual(v);
    else if (a === "budget") return editBudget(v);
    else if (a === "sdate-save") return setSettled();
    else if (a === "sdate-clear") return setSettled("");
    else if (a === "upload") return upload();
    else if (a === "forget") { try { localStorage.removeItem(PWKEY); } catch (x) {} return toast("この端末の記憶を消しました"); }
    render();
  });
  document.addEventListener("change", (e) => { const k = e.target.dataset.chg; if (k) { S[k] = e.target.value; if (k === "month") S.day = null; render(); } });
  document.addEventListener("input", (e) => {
    if (e.target.dataset.inp !== "q") return;
    S.q = e.target.value; const pos = e.target.selectionStart; render();
    const i = $("[data-inp=q]"); i.focus(); i.setSelectionRange(pos, pos);
  });
  // グラフの吹き出し
  const showTip = (e) => {
    const t = e.target.closest && e.target.closest("[data-tip]"), old = $(".tip");
    if (!t) { if (old) old.style.display = "none"; return; }
    const box = t.closest(".chart"); let tip = $(".tip", box);
    if (!tip) { tip = document.createElement("div"); tip.className = "tip"; box.appendChild(tip); }
    if (old && old !== tip) old.style.display = "none";
    tip.innerHTML = t.dataset.tip; tip.style.display = "block";
    const r = box.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    tip.style.left = `${Math.max(0, Math.min(r.width - tip.offsetWidth, x + 12))}px`; tip.style.top = `${Math.max(0, y - tip.offsetHeight - 10)}px`;
  };
  document.addEventListener("pointermove", showTip); document.addEventListener("pointerdown", showTip);

  // ---------- 起動（暗号化されていればパスワードで開く） ----------
  async function decrypt(p, pw) {
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64d(p.salt), iterations: p.iter, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(p.iv) }, key, b64d(p.ct))));
  }
  async function start(data) {
    D = data; D.overrides = D.overrides || {}; D.manual = D.manual || []; D.settled = D.settled || {}; D.budget = D.budget || {};
    if (D.role === "owner") {
      P = K.prepRules(D.rules);
      render();
      // ページを作ったあとにスマホで直した分があれば、最新を読み込む
      if (store.on) try {
        const [o, m, r, s, b] = await Promise.all(["data/overrides.json", "data/manual.json", "rules/mf.json", "data/settled.json", "data/budget.json"].map((p) => store.read(p)));
        if (o.json) D.overrides = o.json; if (m.json) D.manual = m.json; if (r.json) { D.rules.mf = r.json; P = K.prepRules(D.rules); }
        if (s.json) D.settled = s.json; if (b.json) D.budget = b.json;
        dirty(); if (!$(".sheet") && document.activeElement.tagName !== "INPUT") render();
      } catch (e) {}
    } else {
      // 配偶者用は、計算済みの集計と家計の明細だけを受け取る
      D.pre = D.months; D.months = {};
      for (const k in D.pre) { D.months[k] = { txns: [] }; cache[k] = { settlement: D.pre[k].settlement, rows: [], extra: [], checks: {} }; if (D.pre[k].settled) D.settled[k] = D.pre[k].settled; }
      render();
    }
  }
  function lock(msg) {
    app.innerHTML = `<div class="lock"><h2>パスワードを入力してください</h2><form id="lockF"><input type="password" id="pw" autocomplete="current-password" autofocus>
      <label class="check" style="justify-content:center"><input type="checkbox" id="keep" checked> この端末に記憶する</label><div class="err">${esc(msg || "")}</div><button class="btn primary">開く</button></form></div>`;
    $("#lockF").onsubmit = async (e) => {
      e.preventDefault(); const pw = $("#pw").value;
      try { const d = await decrypt(payload, pw); if ($("#keep").checked) try { localStorage.setItem(PWKEY, pw); } catch (x) {} start(d); }
      catch (x) { lock("パスワードが違います"); }
    };
  }
  (async () => {
    // ほかのサイトの中に埋め込まれて表示されたときは、何も出さない（だまして操作させる手口を防ぐ）
    if (window.top !== window.self) { document.body.textContent = ""; return; }
    if (!payload.enc) return start(payload.data);
    let saved = null; try { saved = localStorage.getItem(PWKEY); } catch (e) {}
    if (saved) try { return start(await decrypt(payload, saved)); } catch (e) {}
    lock();
  })();
})();
</script>
</body>
</html>
